<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Dailies - Daily Pixel Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Playwrite+AT:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Jost', sans-serif;
      background: #000;
      color: #2B2C34;
    }

    #grainient {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #viewport {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      cursor: grab;
    }

    #viewport.grabbing {
      cursor: grabbing;
    }

    #container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      will-change: transform;
    }

    #grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .grid-item {
      position: absolute;
      box-sizing: border-box;
      overflow: hidden;
      will-change: transform;
      user-select: none;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Card inside grid item */
    .card-container {
      perspective: 1200px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 70%;
      aspect-ratio: 3 / 4;
      max-height: 85%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: #FFFFFE;
      box-shadow: 0 18px 48px rgba(43, 44, 52, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8% 8% 18%;
    }

    .card-back {
      transform: rotateY(180deg);
      padding: 10%;
      align-items: flex-start;
      justify-content: flex-end;
    }

    .pixel-canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    .card-back-content {
      text-align: left;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .card-title {
      font-size: clamp(10px, 1.5vw, 18px);
      line-height: 0.9;
      font-weight: 500;
      font-family: 'Playwrite AT', 'Jost', sans-serif;
      color: #2B2C34;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div id="grainient" class="grainient-container"></div>
  <div id="viewport">
    <div id="container">
      <div id="grid"></div>
    </div>
  </div>

  <!-- Grainient background shader -->
  <script type="module">
    import { Renderer, Program, Mesh, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.7/dist/ogl.mjs';

    const hexToRgb = (hex) => {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!result) return [1, 1, 1];
      return [parseInt(result[1], 16) / 255, parseInt(result[2], 16) / 255, parseInt(result[3], 16) / 255];
    };

    const vertex = `#version 300 es
    in vec2 position;
    void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

    const fragment = `#version 300 es
    precision highp float;
    uniform vec2 iResolution;
    uniform float iTime;
    uniform float uTimeSpeed;
    uniform float uColorBalance;
    uniform float uWarpStrength;
    uniform float uWarpFrequency;
    uniform float uWarpSpeed;
    uniform float uWarpAmplitude;
    uniform float uBlendAngle;
    uniform float uBlendSoftness;
    uniform float uRotationAmount;
    uniform float uNoiseScale;
    uniform float uGrainAmount;
    uniform float uGrainScale;
    uniform float uGrainAnimated;
    uniform float uContrast;
    uniform float uGamma;
    uniform float uSaturation;
    uniform vec2 uCenterOffset;
    uniform float uZoom;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    out vec4 fragColor;
    #define S(a,b,t) smoothstep(a,b,t)
    mat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
    vec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);float n=mix(mix(dot(-1.0+2.0*hash(i+vec2(0.0,0.0)),f-vec2(0.0,0.0)),dot(-1.0+2.0*hash(i+vec2(1.0,0.0)),f-vec2(1.0,0.0)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0.0,1.0)),f-vec2(0.0,1.0)),dot(-1.0+2.0*hash(i+vec2(1.0,1.0)),f-vec2(1.0,1.0)),u.x),u.y);return 0.5+0.5*n;}
    void mainImage(out vec4 o, vec2 C){
      float t=iTime*uTimeSpeed;
      vec2 uv=C/iResolution.xy;
      float ratio=iResolution.x/iResolution.y;
      vec2 tuv=uv-0.5+uCenterOffset;
      tuv/=max(uZoom,0.001);
      float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*uNoiseScale);
      tuv.y*=1.0/ratio;
      tuv*=Rot(radians((degree-0.5)*uRotationAmount+180.0));
      tuv.y*=ratio;
      float frequency=uWarpFrequency;
      float ws=max(uWarpStrength,0.001);
      float amplitude=uWarpAmplitude/ws;
      float warpTime=t*uWarpSpeed;
      tuv.x+=sin(tuv.y*frequency+warpTime)/amplitude;
      tuv.y+=sin(tuv.x*(frequency*1.5)+warpTime)/(amplitude*0.5);
      vec3 colLav=uColor1;
      vec3 colOrg=uColor2;
      vec3 colDark=uColor3;
      float b=uColorBalance;
      float s=max(uBlendSoftness,0.0);
      mat2 blendRot=Rot(radians(uBlendAngle));
      float blendX=(tuv*blendRot).x;
      float edge0=-0.3-b-s;
      float edge1=0.2-b+s;
      float v0=0.5-b+s;
      float v1=-0.3-b-s;
      vec3 layer1=mix(colDark,colOrg,S(edge0,edge1,blendX));
      vec3 layer2=mix(colOrg,colLav,S(edge0,edge1,blendX));
      vec3 col=mix(layer1,layer2,S(v0,v1,tuv.y));
      vec2 grainUv=uv*max(uGrainScale,0.001);
      if(uGrainAnimated>0.5){grainUv+=vec2(iTime*0.05);}
      float grain=fract(sin(dot(grainUv,vec2(12.9898,78.233)))*43758.5453);
      col+=(grain-0.5)*uGrainAmount;
      col=(col-0.5)*uContrast+0.5;
      float luma=dot(col,vec3(0.2126,0.7152,0.0722));
      col=mix(vec3(luma),col,uSaturation);
      col=pow(max(col,0.0),vec3(1.0/max(uGamma,0.001)));
      col=clamp(col,0.0,1.0);
      o=vec4(col,1.0);
    }
    void main(){
      vec4 o=vec4(0.0);
      mainImage(o,gl_FragCoord.xy);
      fragColor=o;
    }`;

    const container = document.getElementById('grainient');
    const renderer = new Renderer({ webgl: 2, alpha: true, antialias: false, dpr: Math.min(window.devicePixelRatio || 1, 2) });
    const gl = renderer.gl;
    const canvas = gl.canvas;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.display = 'block';
    container.appendChild(canvas);

    const program = new Program(gl, {
      vertex, fragment,
      uniforms: {
        iTime: { value: 0 }, iResolution: { value: new Float32Array([1, 1]) },
        uTimeSpeed: { value: 0.25 }, uColorBalance: { value: 0.0 },
        uWarpStrength: { value: 1.0 }, uWarpFrequency: { value: 5.0 },
        uWarpSpeed: { value: 2.0 }, uWarpAmplitude: { value: 50.0 },
        uBlendAngle: { value: 0.0 }, uBlendSoftness: { value: 0.05 },
        uRotationAmount: { value: 500.0 }, uNoiseScale: { value: 2.0 },
        uGrainAmount: { value: 0.1 }, uGrainScale: { value: 2.0 },
        uGrainAnimated: { value: 0.0 }, uContrast: { value: 1.5 },
        uGamma: { value: 1.0 }, uSaturation: { value: 1.0 },
        uCenterOffset: { value: new Float32Array([0.0, 0.0]) },
        uZoom: { value: 0.9 },
        uColor1: { value: new Float32Array(hexToRgb('#FF9FFC')) },
        uColor2: { value: new Float32Array(hexToRgb('#5227FF')) },
        uColor3: { value: new Float32Array(hexToRgb('#B19EEF')) }
      }
    });

    const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });

    const setSize = () => {
      const rect = container.getBoundingClientRect();
      renderer.setSize(Math.max(1, Math.floor(rect.width)), Math.max(1, Math.floor(rect.height)));
      const res = program.uniforms.iResolution.value;
      res[0] = gl.drawingBufferWidth;
      res[1] = gl.drawingBufferHeight;
    };

    new ResizeObserver(setSize).observe(container);
    setSize();

    const t0 = performance.now();
    const loop = (t) => {
      program.uniforms.iTime.value = (t - t0) * 0.001;
      renderer.render({ scene: mesh });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  </script>

  <script src="data.js"></script>
  <script>
    // ── Infinite Grid System ──
    const viewport = document.getElementById('viewport');
    const containerEl = document.getElementById('container');
    const gridEl = document.getElementById('grid');

    const CONFIG = {
      COLS: 3,
      ROWS: 3,
      easingFactor: 0.1,
      rotationStrength: 0.1,
      rotationEasing: 0.06,
      scaleEasing: 0.08,
      maxScaleEffect: 0.15,
      tileOverscan: 1,
      parallaxFactor: 0.15
    };

    const state = {
      gridItems: [],
      cameraOffset: { x: 0, y: 0 },
      targetOffset: { x: 0, y: 0 },
      isDragging: false,
      previousMousePosition: { x: 0, y: 0 },
      touchStart: null,
      containerRotationX: 0,
      containerRotationY: 0,
      targetRotationX: 0,
      targetRotationY: 0,
      containerScale: 1,
      targetScale: 1,
      scrollSpeed: 0
    };

    let cellWidth, cellHeight;
    let tilesX = 1, tilesY = 1;

    // ── Sizing ──
    const calculateCellSizeAndTiling = () => {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const minScale = 1 - CONFIG.maxScaleEffect;
      const requiredCoverFactor = 1 / minScale;
      const size = Math.max(vw / CONFIG.COLS, vh / CONFIG.ROWS) * requiredCoverFactor;
      cellWidth = size;
      cellHeight = size;
      const totalWidth = cellWidth * CONFIG.COLS;
      const totalHeight = cellHeight * CONFIG.ROWS;
      tilesX = Math.max(1, Math.ceil((vw * requiredCoverFactor) / totalWidth) + CONFIG.tileOverscan);
      tilesY = Math.max(1, Math.ceil((vh * requiredCoverFactor) / totalHeight) + CONFIG.tileOverscan);
    };

    // ── Render pixel art onto a canvas ──
    function renderPixelCanvas(canvas, piece) {
      const ctx = canvas.getContext('2d');
      const dotSize = 10;
      const gap = 2;
      const cellSz = dotSize + gap;
      const canvasSize = piece.size * cellSz;
      canvas.width = canvasSize;
      canvas.height = canvasSize;
      canvas.style.background = piece.palette[0];

      ctx.clearRect(0, 0, canvasSize, canvasSize);
      const frameData = piece.frames[0];
      for (let y = 0; y < piece.size; y++) {
        for (let x = 0; x < piece.size; x++) {
          const index = y * piece.size + x;
          const colorIndex = parseInt(frameData[index], 16);
          if (colorIndex === 0) continue;
          ctx.fillStyle = piece.palette[colorIndex];
          ctx.fillRect(x * cellSz + gap, y * cellSz + gap, dotSize, dotSize);
        }
      }
    }

    // ── Create grid items ──
    const createGridItems = () => {
      gridEl.innerHTML = '';
      state.gridItems = [];

      const pieces = [...gallery].sort((a, b) => new Date(b.date) - new Date(a.date));
      const total = CONFIG.COLS * CONFIG.ROWS; // 9 slots

      for (let tileY = -tilesY; tileY <= tilesY; tileY++) {
        for (let tileX = -tilesX; tileX <= tilesX; tileX++) {
          for (let y = 0; y < CONFIG.ROWS; y++) {
            for (let x = 0; x < CONFIG.COLS; x++) {
              const pieceIndex = (y * CONFIG.COLS + x) % pieces.length;
              const piece = pieces[pieceIndex];
              const yOffset = x * cellHeight * CONFIG.parallaxFactor;

              const el = document.createElement('div');
              el.className = 'grid-item';
              el.style.width = `${cellWidth}px`;
              el.style.height = `${cellHeight}px`;

              // Build card
              const cardContainer = document.createElement('div');
              cardContainer.className = 'card-container';

              const card = document.createElement('div');
              card.className = 'card';

              const front = document.createElement('div');
              front.className = 'card-face card-front';

              const canvas = document.createElement('canvas');
              canvas.className = 'pixel-canvas';
              renderPixelCanvas(canvas, piece);
              front.appendChild(canvas);

              const back = document.createElement('div');
              back.className = 'card-face card-back';
              const titleColor = piece.palette[1] || '#2B2C34';
              back.innerHTML = `<div class="card-back-content"><h2 class="card-title" style="color:${titleColor}">${piece.title}</h2></div>`;

              card.appendChild(front);
              card.appendChild(back);
              cardContainer.appendChild(card);
              el.appendChild(cardContainer);

              // Flip on click (only if not dragged)
              let didDrag = false;
              el.addEventListener('pointerdown', () => { didDrag = false; });
              el.addEventListener('pointermove', () => { didDrag = true; });
              el.addEventListener('click', (e) => {
                if (!didDrag) card.classList.toggle('flipped');
              });

              gridEl.appendChild(el);
              state.gridItems.push({ element: el, baseX: x, baseY: y, tileX, tileY, yOffset });
            }
          }
        }
      }
    };

    // ── Position updates (the infinite scroll trick) ──
    const updateItemPositions = () => {
      const totalWidth = cellWidth * CONFIG.COLS;
      const totalHeight = cellHeight * CONFIG.ROWS;
      state.gridItems.forEach(({ element, baseX, baseY, tileX, tileY, yOffset }) => {
        const baseOffsetX = state.cameraOffset.x % totalWidth;
        const baseOffsetY = state.cameraOffset.y % totalHeight;
        const px = baseX * cellWidth + tileX * totalWidth - baseOffsetX;
        const py = baseY * cellHeight + tileY * totalHeight - baseOffsetY + yOffset;
        element.style.transform = `translate3d(${px}px, ${py}px, 0)`;
      });
    };

    // ── Event handlers ──
    const onMouseDown = (e) => {
      state.isDragging = true;
      viewport.classList.add('grabbing');
      state.previousMousePosition = { x: e.clientX, y: e.clientY };
    };

    const onMouseMove = (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.previousMousePosition.x;
      const dy = e.clientY - state.previousMousePosition.y;
      state.targetOffset.x += dx;
      state.targetOffset.y += dy;
      state.previousMousePosition = { x: e.clientX, y: e.clientY };

      const speed = Math.sqrt(dx * dx + dy * dy);
      state.scrollSpeed = Math.max(state.scrollSpeed, speed);
      state.targetRotationX = dx * CONFIG.rotationStrength;
      state.targetRotationY = -dy * CONFIG.rotationStrength;
    };

    const onMouseUp = () => {
      state.isDragging = false;
      viewport.classList.remove('grabbing');
      state.targetRotationX = 0;
      state.targetRotationY = 0;
    };

    const onWheel = (e) => {
      e.preventDefault();
      state.targetOffset.x -= e.deltaX;
      state.targetOffset.y -= e.deltaY;
      const speed = Math.sqrt(e.deltaX * e.deltaX + e.deltaY * e.deltaY);
      state.scrollSpeed = Math.max(state.scrollSpeed, speed);
      state.targetRotationX = -e.deltaX * CONFIG.rotationStrength * 0.3;
      state.targetRotationY = e.deltaY * CONFIG.rotationStrength * 0.3;
    };

    // Touch
    const onTouchStart = (e) => {
      if (e.touches.length === 1) {
        state.isDragging = true;
        state.touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        state.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    };

    const onTouchMove = (e) => {
      if (!state.isDragging || e.touches.length !== 1) return;
      e.preventDefault();
      const dx = e.touches[0].clientX - state.previousMousePosition.x;
      const dy = e.touches[0].clientY - state.previousMousePosition.y;
      state.targetOffset.x += dx;
      state.targetOffset.y += dy;
      state.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      const speed = Math.sqrt(dx * dx + dy * dy);
      state.scrollSpeed = Math.max(state.scrollSpeed, speed);
      state.targetRotationX = dx * CONFIG.rotationStrength;
      state.targetRotationY = -dy * CONFIG.rotationStrength;
    };

    const onTouchEnd = () => {
      state.isDragging = false;
      state.targetRotationX = 0;
      state.targetRotationY = 0;
    };

    viewport.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    viewport.addEventListener('wheel', onWheel, { passive: false });
    viewport.addEventListener('touchstart', onTouchStart, { passive: true });
    viewport.addEventListener('touchmove', onTouchMove, { passive: false });
    viewport.addEventListener('touchend', onTouchEnd);

    // ── Animation loop ──
    const animate = () => {
      requestAnimationFrame(animate);

      const dx = state.targetOffset.x - state.cameraOffset.x;
      const dy = state.targetOffset.y - state.cameraOffset.y;

      if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
        state.cameraOffset.x += dx * CONFIG.easingFactor;
        state.cameraOffset.y += dy * CONFIG.easingFactor;
        updateItemPositions();
      }

      const speedFactor = Math.min(state.scrollSpeed * 0.01, 1);
      state.targetScale = 1 - (speedFactor * CONFIG.maxScaleEffect);
      state.scrollSpeed *= 0.85;

      state.containerScale += (state.targetScale - state.containerScale) * CONFIG.scaleEasing;
      state.containerRotationX += (state.targetRotationX - state.containerRotationX) * CONFIG.rotationEasing;
      state.containerRotationY += (state.targetRotationY - state.containerRotationY) * CONFIG.rotationEasing;

      containerEl.style.transform =
        `scale(${state.containerScale}) skewY(${state.containerRotationX}deg) skewX(${state.containerRotationY}deg)`;
    };

    // ── Init ──
    const init = () => {
      calculateCellSizeAndTiling();
      createGridItems();
      updateItemPositions();
      animate();
    };

    window.addEventListener('resize', () => {
      calculateCellSizeAndTiling();
      createGridItems();
      updateItemPositions();
    });

    init();
  </script>
</body>
</html>
