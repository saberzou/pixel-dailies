<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Dailies - Daily Pixel Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Playwrite+AT:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: transparent;
      color: #2B2C34;
      padding: 0;
      min-height: 100vh;
    }

    #grainient {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .site-title {
      font-family: 'Playwrite AT', 'Jost', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .site-subtitle {
      font-size: 1.125rem;
      color: #5A5A5A;
      font-weight: 400;
    }

    .gallery {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 6rem;
    }

    .card-container {
      perspective: 1200px;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-width: 200px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: #FFFFFE;
      border-radius: 0;
      box-shadow: 0 18px 48px rgba(43, 44, 52, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0.75rem 0.75rem 2.5rem;
    }

    .card-front {
      /* front is default */
    }

    .card-back {
      transform: rotateY(180deg);
      background: #FFFFFE;
      padding: 1rem;
      align-items: flex-start;
      justify-content: flex-end;
    }

    .pixel-canvas {
      width: 100%;
      height: auto;
      max-width: 220px;
      display: block;
    }

    .card-back-content {
      text-align: left;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .card-title {
      font-size: 16px;
      line-height: 0.7;
      font-weight: 500;
      color: #2B2C34;
      letter-spacing: -0.01em;
    }

    @media (max-width: 640px) {
      .site-title {
        font-size: 2.25rem;
      }

      .site-subtitle {
        font-size: 1rem;
      }

      .gallery {
        gap: 6rem;
        padding: 1.5rem 1rem 3rem;
      }

      .card-container {
        max-width: 240px;
      }

      .card-face {
        padding: 0.75rem 0.75rem 2.5rem;
      }

      .card-back {
        padding: 2rem;
      }

      .card-title {
        font-size: 1.75rem;
      }
    }

    @media (max-width: 400px) {
      .site-title {
        font-size: 1.875rem;
      }

      .card-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="grainient" class="grainient-container"></div>
  <div class="page">
  <div class="header">
    <h1 class="site-title">Pixel Dailies</h1>
    <p class="site-subtitle">A new piece of pixel art, every day.</p>
  </div>

  <div class="gallery" id="gallery"></div>
  </div>

  <script type="module">
    import { Renderer, Program, Mesh, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.7/dist/ogl.mjs';

    const hexToRgb = (hex) => {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!result) return [1, 1, 1];
      return [parseInt(result[1], 16) / 255, parseInt(result[2], 16) / 255, parseInt(result[3], 16) / 255];
    };

    const vertex = `#version 300 es
    in vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
    `;

    const fragment = `#version 300 es
    precision highp float;
    uniform vec2 iResolution;
    uniform float iTime;
    uniform float uTimeSpeed;
    uniform float uColorBalance;
    uniform float uWarpStrength;
    uniform float uWarpFrequency;
    uniform float uWarpSpeed;
    uniform float uWarpAmplitude;
    uniform float uBlendAngle;
    uniform float uBlendSoftness;
    uniform float uRotationAmount;
    uniform float uNoiseScale;
    uniform float uGrainAmount;
    uniform float uGrainScale;
    uniform float uGrainAnimated;
    uniform float uContrast;
    uniform float uGamma;
    uniform float uSaturation;
    uniform vec2 uCenterOffset;
    uniform float uZoom;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    out vec4 fragColor;
    #define S(a,b,t) smoothstep(a,b,t)
    mat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);} 
    vec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);} 
    float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);float n=mix(mix(dot(-1.0+2.0*hash(i+vec2(0.0,0.0)),f-vec2(0.0,0.0)),dot(-1.0+2.0*hash(i+vec2(1.0,0.0)),f-vec2(1.0,0.0)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0.0,1.0)),f-vec2(0.0,1.0)),dot(-1.0+2.0*hash(i+vec2(1.0,1.0)),f-vec2(1.0,1.0)),u.x),u.y);return 0.5+0.5*n;}
    void mainImage(out vec4 o, vec2 C){
      float t=iTime*uTimeSpeed;
      vec2 uv=C/iResolution.xy;
      float ratio=iResolution.x/iResolution.y;
      vec2 tuv=uv-0.5+uCenterOffset;
      tuv/=max(uZoom,0.001);

      float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*uNoiseScale);
      tuv.y*=1.0/ratio;
      tuv*=Rot(radians((degree-0.5)*uRotationAmount+180.0));
      tuv.y*=ratio;

      float frequency=uWarpFrequency;
      float ws=max(uWarpStrength,0.001);
      float amplitude=uWarpAmplitude/ws;
      float warpTime=t*uWarpSpeed;
      tuv.x+=sin(tuv.y*frequency+warpTime)/amplitude;
      tuv.y+=sin(tuv.x*(frequency*1.5)+warpTime)/(amplitude*0.5);

      vec3 colLav=uColor1;
      vec3 colOrg=uColor2;
      vec3 colDark=uColor3;
      float b=uColorBalance;
      float s=max(uBlendSoftness,0.0);
      mat2 blendRot=Rot(radians(uBlendAngle));
      float blendX=(tuv*blendRot).x;
      float edge0=-0.3-b-s;
      float edge1=0.2-b+s;
      float v0=0.5-b+s;
      float v1=-0.3-b-s;
      vec3 layer1=mix(colDark,colOrg,S(edge0,edge1,blendX));
      vec3 layer2=mix(colOrg,colLav,S(edge0,edge1,blendX));
      vec3 col=mix(layer1,layer2,S(v0,v1,tuv.y));

      vec2 grainUv=uv*max(uGrainScale,0.001);
      if(uGrainAnimated>0.5){grainUv+=vec2(iTime*0.05);} 
      float grain=fract(sin(dot(grainUv,vec2(12.9898,78.233)))*43758.5453);
      col+=(grain-0.5)*uGrainAmount;

      col=(col-0.5)*uContrast+0.5;
      float luma=dot(col,vec3(0.2126,0.7152,0.0722));
      col=mix(vec3(luma),col,uSaturation);
      col=pow(max(col,0.0),vec3(1.0/max(uGamma,0.001)));
      col=clamp(col,0.0,1.0);

      o=vec4(col,1.0);
    }
    void main(){
      vec4 o=vec4(0.0);
      mainImage(o,gl_FragCoord.xy);
      fragColor=o;
    }
    `;

    const container = document.getElementById('grainient');
    const renderer = new Renderer({ webgl: 2, alpha: true, antialias: false, dpr: Math.min(window.devicePixelRatio || 1, 2) });
    const gl = renderer.gl;
    const canvas = gl.canvas;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.display = 'block';
    container.appendChild(canvas);

    const program = new Program(gl, {
      vertex,
      fragment,
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new Float32Array([1, 1]) },
        uTimeSpeed: { value: 0.25 },
        uColorBalance: { value: 0.0 },
        uWarpStrength: { value: 1.0 },
        uWarpFrequency: { value: 5.0 },
        uWarpSpeed: { value: 2.0 },
        uWarpAmplitude: { value: 50.0 },
        uBlendAngle: { value: 0.0 },
        uBlendSoftness: { value: 0.05 },
        uRotationAmount: { value: 500.0 },
        uNoiseScale: { value: 2.0 },
        uGrainAmount: { value: 0.1 },
        uGrainScale: { value: 2.0 },
        uGrainAnimated: { value: 0.0 },
        uContrast: { value: 1.5 },
        uGamma: { value: 1.0 },
        uSaturation: { value: 1.0 },
        uCenterOffset: { value: new Float32Array([0.0, 0.0]) },
        uZoom: { value: 0.9 },
        uColor1: { value: new Float32Array(hexToRgb('#FF9FFC')) },
        uColor2: { value: new Float32Array(hexToRgb('#5227FF')) },
        uColor3: { value: new Float32Array(hexToRgb('#B19EEF')) }
      }
    });

    const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });

    const setSize = () => {
      const rect = container.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      renderer.setSize(width, height);
      const res = program.uniforms.iResolution.value;
      res[0] = gl.drawingBufferWidth;
      res[1] = gl.drawingBufferHeight;
    };

    const ro = new ResizeObserver(setSize);
    ro.observe(container);
    setSize();

    const t0 = performance.now();
    const loop = (t) => {
      program.uniforms.iTime.value = (t - t0) * 0.001;
      renderer.render({ scene: mesh });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  </script>

  <script src="data.js"></script>
  <script>
    // Animation state tracking
    const animationStates = new Map();

    function createCard(piece) {
      const container = document.createElement('div');
      container.className = 'card-container';

      const card = document.createElement('div');
      card.className = 'card';

      // Front face with pixel art
      const front = document.createElement('div');
      front.className = 'card-face card-front';

      // Set card background based on piece background - card stays white (Polaroid)
      // Canvas background handles the art bg

      const canvas = document.createElement('canvas');
      canvas.className = 'pixel-canvas';
      // Canvas size: 20x20 grid, 12px per cell (10px dot + 2px gap)
      const cellSize = 12;
      const canvasSize = piece.size * cellSize;
      canvas.width = canvasSize;
      canvas.height = canvasSize;
      canvas.style.background = piece.palette[0];
      front.appendChild(canvas);

      // Back face with title
      const back = document.createElement('div');
      back.className = 'card-face card-back';
      const titleColor = piece.palette[1] || '#2B2C34';
      back.innerHTML = `
        <div class="card-back-content">
          <h2 class="card-title" style="color:${titleColor}">${piece.title}</h2>
        </div>
      `;

      card.appendChild(front);
      card.appendChild(back);
      container.appendChild(card);

      // Flip card on click
      card.addEventListener('click', () => {
        card.classList.toggle('flipped');
      });

      // Start animation
      startAnimation(canvas, piece);

      return container;
    }

    function startAnimation(canvas, piece) {
      const ctx = canvas.getContext('2d');
      let currentFrame = 0;
      const frameDelay = 1000 / piece.fps;
      let lastFrameTime = 0;

      const dotSize = 10;
      const gap = 2;
      const cellSize = dotSize + gap;
      const canvasSize = piece.size * cellSize;

      function drawFrame() {
        const frameData = piece.frames[0];
        const palette = piece.palette;

        // Clear canvas
        ctx.clearRect(0, 0, canvasSize, canvasSize);

        // Draw square dots (no animation)
        for (let y = 0; y < piece.size; y++) {
          for (let x = 0; x < piece.size; x++) {
            const index = y * piece.size + x;
            const colorIndex = parseInt(frameData[index], 16);
            if (colorIndex === 0) continue;
            const color = palette[colorIndex];
            const px = x * cellSize + gap;
            const py = y * cellSize + gap;
            ctx.fillStyle = color;
            ctx.fillRect(px, py, dotSize, dotSize);
          }
        }
      }

      drawFrame();
    }

    // Render gallery
    function renderGallery() {
      const galleryEl = document.getElementById('gallery');

      // Sort by date descending (newest first)
      const sorted = [...gallery].sort((a, b) =>
        new Date(b.date) - new Date(a.date)
      );

      sorted.forEach(piece => {
        const card = createCard(piece);
        galleryEl.appendChild(card);
      });
    }

    // Initialize
    renderGallery();

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      animationStates.forEach((animId) => {
        cancelAnimationFrame(animId);
      });
      animationStates.clear();
    });
  </script>
</body>
</html>
