<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Dailies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100dvh;
      width: 100dvw;
      user-select: none;
    }

    /* ── Header ── */
    #header {
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      padding: 1.75rem 2rem;
      pointer-events: none;
    }
    #header h1 {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    /* ── Top vignette ── */
    #vignette {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 180px;
      background: linear-gradient(to bottom, rgba(10,10,10,0.96) 0%, rgba(10,10,10,0) 100%);
      z-index: 50;
      pointer-events: none;
    }

    /* ── Viewport / draggable surface ── */
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
    }
    #viewport.grabbing { cursor: grabbing; }

    /* ── Grid container (dragged by GSAP) ── */
    #grid-container {
      position: absolute;
      top: 0; left: 0;
      will-change: transform;
    }

    /* ── CSS grid ── */
    #grid { display: grid; }

    /* ── Individual grid items ── */
    .grid-item {
      width: 240px;
      height: 240px;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      transition: opacity 0.5s ease;
    }
    .grid-item.faded { opacity: 0.1; }
    .grid-item canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* ── Flip stage: left-half anchor for selected item ── */
    #flip-stage {
      position: fixed;
      top: 0; left: 0;
      width: 50%;
      height: 100%;
      z-index: 190;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 0;
    }

    /* ── Detail panel (right half) ── */
    #detail-panel {
      position: fixed;
      top: 0; right: 0;
      width: 50%;
      height: 100%;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 4rem 3.5rem;
      background: #0a0a0a;
    }
    #detail-panel.open { pointer-events: all; }

    #close-btn {
      position: absolute;
      top: 1.5rem; right: 2rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-size: 1.1rem;
      cursor: pointer;
      font-family: monospace;
      transition: color 0.2s;
      line-height: 1;
    }
    #close-btn:hover { color: #fff; }

    .d-date {
      font-family: monospace;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 0.6rem;
    }
    .d-title {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 2.5rem;
    }
    .d-palette {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── Zoom bar ── */
    #zoom-bar {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 100px;
      padding: 5px 8px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .zbtn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 100px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .zbtn:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .zdiv { width: 1px; height: 12px; background: rgba(255,255,255,0.1); margin: 0 2px; flex-shrink: 0; }
    #zoom-pct {
      font-family: monospace;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.28);
      min-width: 38px;
      text-align: center;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<div id="header"><h1>Pixel Dailies</h1></div>
<div id="vignette"></div>

<div id="viewport">
  <div id="grid-container">
    <div id="grid"></div>
  </div>
</div>

<div id="flip-stage"></div>

<div id="detail-panel">
  <button id="close-btn">&#x2715;</button>
  <div class="d-date" id="d-date"></div>
  <div class="d-title" id="d-title"></div>
  <div class="d-palette" id="d-palette"></div>
</div>

<div id="zoom-bar">
  <button class="zbtn" id="btn-out">Zoom Out</button>
  <div class="zdiv"></div>
  <button class="zbtn" id="btn-100">Normal</button>
  <div class="zdiv"></div>
  <button class="zbtn" id="btn-in">Zoom In</button>
  <div class="zdiv"></div>
  <button class="zbtn" id="btn-fit">Fit</button>
  <div class="zdiv"></div>
  <span id="zoom-pct">100%</span>
</div>

<!-- GSAP suite -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Flip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/InertiaPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/CustomEase.min.js"></script>
<script src="data.js"></script>

<script>
  gsap.registerPlugin(Draggable, Flip, InertiaPlugin, CustomEase);
  CustomEase.create('eSnap', 'M0,0 C0.05,0 0.18,1 1,1');

  // ── Constants ──
  var ITEM_SIZE = 240;
  var ITEM_GAP  = 16;
  var COLS = Math.ceil(Math.sqrt(gallery.length));
  var ROWS = Math.ceil(gallery.length / COLS);
  var GRID_W = COLS * ITEM_SIZE + (COLS - 1) * ITEM_GAP;
  var GRID_H = ROWS * ITEM_SIZE + (ROWS - 1) * ITEM_GAP;

  // Sort newest first
  var pieces = gallery.slice().sort(function(a, b) {
    return new Date(b.date) - new Date(a.date);
  });

  // ── DOM refs ──
  var gridEl    = document.getElementById('grid');
  var gcEl      = document.getElementById('grid-container');
  var vpEl      = document.getElementById('viewport');
  var stageEl   = document.getElementById('flip-stage');
  var panelEl   = document.getElementById('detail-panel');
  var zoomPctEl = document.getElementById('zoom-pct');

  // ── State ──
  var currentScale = 1;
  var draggables   = null;
  var activeItem   = null;
  var didDrag      = false;

  // ── Pixel art renderer ──
  function renderCanvas(canvas, piece) {
    var DOT  = 9;
    var PGAP = 2;
    var CELL = DOT + PGAP;
    var SZ   = piece.size * CELL + PGAP;
    canvas.width  = SZ;
    canvas.height = SZ;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = piece.palette[0];
    ctx.fillRect(0, 0, SZ, SZ);
    var data = piece.frames[0];
    for (var row = 0; row < piece.size; row++) {
      for (var col = 0; col < piece.size; col++) {
        var ci = parseInt(data[row * piece.size + col], 16);
        if (!ci) continue;
        ctx.fillStyle = piece.palette[ci];
        var px = col * CELL + PGAP;
        var py = row * CELL + PGAP;
        ctx.beginPath();
        ctx.roundRect(px, py, DOT, DOT, 3);
        ctx.fill();
      }
    }
  }

  // ── Build grid ──
  gridEl.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + ITEM_SIZE + 'px)';
  gridEl.style.gridTemplateRows    = 'repeat(' + ROWS + ', ' + ITEM_SIZE + 'px)';
  gridEl.style.gap = ITEM_GAP + 'px';
  gsap.set(gcEl, { transformOrigin: '0 0' });

  var items = pieces.map(function(piece, i) {
    var el = document.createElement('div');
    el.className = 'grid-item';
    el.style.gridColumn = (i % COLS) + 1;
    el.style.gridRow    = Math.floor(i / COLS) + 1;

    var canvas = document.createElement('canvas');
    renderCanvas(canvas, piece);
    el.appendChild(canvas);
    gridEl.appendChild(el);
    return { el: el, piece: piece };
  });

  // ── IntersectionObserver: fade out-of-viewport items ──
  var fadeObs = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (activeItem && entry.target === activeItem.el) return;
      entry.target.classList.toggle('faded', !entry.isIntersecting);
    });
  }, { root: vpEl, threshold: 0 });

  items.forEach(function(item) { fadeObs.observe(item.el); });

  // ── Helpers ──
  function centeredPos(s) {
    return {
      x: (window.innerWidth  - GRID_W * s) / 2,
      y: (window.innerHeight - GRID_H * s) / 2
    };
  }

  function updateZoomPct() {
    zoomPctEl.textContent = Math.round(currentScale * 100) + '%';
  }

  function refreshDraggable() {
    if (draggables && draggables[0]) draggables[0].update(true);
  }

  // ── Zoom ──
  function setZoom(newScale, tween, reCenter) {
    if (tween === undefined) tween = true;
    if (reCenter === undefined) reCenter = true;
    currentScale = Math.max(0.15, Math.min(4, newScale));
    updateZoomPct();
    var props = { scaleX: currentScale, scaleY: currentScale };
    if (reCenter) {
      var p = centeredPos(currentScale);
      props.x = p.x;
      props.y = p.y;
    }
    if (tween) {
      gsap.to(gcEl, Object.assign({}, props, {
        duration: 0.5,
        ease: 'power3.out',
        onUpdate: refreshDraggable,
        onComplete: refreshDraggable
      }));
    } else {
      gsap.set(gcEl, props);
      refreshDraggable();
    }
  }

  // ── Draggable ──
  function initDraggable() {
    draggables = Draggable.create(gcEl, {
      type: 'x,y',
      inertia: true,
      edgeResistance: 0.6,
      onPress: function() {
        didDrag = false;
        vpEl.classList.add('grabbing');
      },
      onDrag: function() { didDrag = true; },
      onRelease: function() { vpEl.classList.remove('grabbing'); }
    });
  }

  // ── Detail panel ──
  function openDetail(item) {
    if (activeItem === item) { closeDetail(); return; }
    if (activeItem) closeDetail(false);

    var el    = item.el;
    var piece = item.piece;
    activeItem = item;
    el.classList.remove('faded');

    // Populate
    document.getElementById('d-date').textContent  = piece.date;
    document.getElementById('d-title').textContent = piece.title;
    var palEl = document.getElementById('d-palette');
    palEl.innerHTML = '';
    piece.palette.forEach(function(c) {
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = c;
      palEl.appendChild(sw);
    });

    // FLIP: capture state, move to stage, animate
    var flipState = Flip.getState(el);
    stageEl.appendChild(el);
    // Fill the left panel proportionally (square pixel art → use min dimension)
    var stageW = stageEl.offsetWidth;
    var stageH = stageEl.offsetHeight;
    var fillSize = Math.min(stageW, stageH);
    el.style.width  = fillSize + 'px';
    el.style.height = fillSize + 'px';
    el.style.borderRadius = '0';
    Flip.from(flipState, {
      duration: 0.65,
      ease: 'eSnap',
      scale: true,
      absolute: true
    });

    // Slide in panel
    panelEl.classList.add('open');
    gsap.to(panelEl, { x: 0, duration: 0.55, ease: 'power3.out' });
  }

  function closeDetail(animate) {
    if (animate === undefined) animate = true;
    if (!activeItem) return;
    var el = activeItem.el;
    activeItem = null;

    // FLIP back to grid
    var flipState = Flip.getState(el);
    el.style.width  = '';
    el.style.height = '';
    el.style.borderRadius = '';
    gridEl.appendChild(el);
    Flip.from(flipState, {
      duration: animate ? 0.5 : 0.001,
      ease: 'power3.inOut',
      scale: true,
      absolute: true
    });

    gsap.to(panelEl, {
      x: '100%',
      duration: animate ? 0.4 : 0.001,
      ease: 'power3.in',
      onComplete: function() { panelEl.classList.remove('open'); }
    });
  }

  document.getElementById('close-btn').addEventListener('click', function() { closeDetail(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDetail(); });

  // ── Item click (distinguish from drag) ──
  items.forEach(function(item) {
    item.el.addEventListener('pointerdown', function() { didDrag = false; });
    item.el.addEventListener('click', function() {
      if (!didDrag) openDetail(item);
    });
  });

  // ── Zoom controls ──
  document.getElementById('btn-out').addEventListener('click', function() {
    setZoom(currentScale - 0.25);
  });
  document.getElementById('btn-in').addEventListener('click', function() {
    setZoom(currentScale + 0.25);
  });
  document.getElementById('btn-100').addEventListener('click', function() {
    setZoom(1);
  });
  document.getElementById('btn-fit').addEventListener('click', function() {
    var margin   = 80;
    var fitScale = Math.min(
      (window.innerWidth  - margin) / GRID_W,
      (window.innerHeight - margin) / GRID_H
    );
    setZoom(fitScale);
  });

  // ── Intro animation: items scatter from center ──
  function doIntro() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var p  = centeredPos(1);
    gsap.set(gcEl, { x: p.x, y: p.y, scaleX: 1, scaleY: 1 });

    items.forEach(function(item, i) {
      var col = i % COLS;
      var row = Math.floor(i / COLS);
      // Item center in viewport coords
      var icx = p.x + col * (ITEM_SIZE + ITEM_GAP) + ITEM_SIZE / 2;
      var icy = p.y + row * (ITEM_SIZE + ITEM_GAP) + ITEM_SIZE / 2;
      // Offset so all items start at viewport center
      var dx = vw / 2 - icx;
      var dy = vh / 2 - icy;

      gsap.set(item.el, { x: dx, y: dy, scale: 0.45, opacity: 0 });
      gsap.to(item.el, {
        x: 0, y: 0, scale: 1, opacity: 1,
        duration: 0.9,
        delay: 0.05 + i * 0.035,
        ease: 'expo.out',
        clearProps: 'x,y,scale,opacity'
      });
    });
  }

  // ── Init ──
  initDraggable();
  gsap.set(panelEl, { x: '100%' });
  updateZoomPct();

  var initPos = centeredPos(1);
  gsap.set(gcEl, { x: initPos.x, y: initPos.y, scaleX: 1, scaleY: 1 });
  refreshDraggable();

  doIntro();

  window.addEventListener('resize', function() {
    if (!activeItem) {
      var p = centeredPos(currentScale);
      gsap.set(gcEl, { x: p.x, y: p.y });
      refreshDraggable();
    }
  });
</script>
</body>
</html>
